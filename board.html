<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Governance Records — MinuteHand</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <header>
    <div class="container">
      <a href="/" class="logo" aria-label="MinuteHand home">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
          <line x1="14" y1="14" x2="14" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="14" y1="14" x2="19" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>MinuteHand</span>
      </a>
      <p class="tagline">Governance Records</p>
    </div>
  </header>

  <main class="container">

    <div id="loading-view" class="board-loading">
      <div class="spinner"></div>
      <span>Loading…</span>
    </div>

    <section id="access-section" class="card hidden">
      <h1 style="font-size:1.2rem;margin-bottom:0.5rem">Governance Records</h1>
      <p id="access-msg"></p>
      <div id="access-actions" style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:0.75rem"></div>
    </section>

    <div id="board-view" class="hidden">

      <div class="board-header">
        <div>
          <h1 id="org-name-heading"></h1>
          <p class="field-hint" id="org-type-label"></p>
        </div>
        <a href="/app.html" class="btn-ghost">← Generate Minutes</a>
      </div>

      <nav class="board-tabs" role="tablist">
        <button class="board-tab board-tab--active" data-tab="motions" role="tab" aria-selected="true">
          Motions
        </button>
        <button class="board-tab" data-tab="actions" role="tab" aria-selected="false">
          Action Items
        </button>
        <button class="board-tab" data-tab="agenda" role="tab" aria-selected="false">
          Next Agenda
        </button>
      </nav>

      <div id="motions-view" role="tabpanel">
        <div class="registry-filters">
          <input type="search" id="motion-search" class="registry-search"
                 placeholder="Search motions…" autocomplete="off">
          <select id="status-filter" class="registry-select">
            <option value="">All statuses</option>
            <option value="carried">Carried</option>
            <option value="defeated">Defeated</option>
            <option value="tabled">Tabled</option>
            <option value="withdrawn">Withdrawn</option>
          </select>
          <input type="date" id="date-from" class="registry-date" aria-label="From date"
                 title="From date">
          <input type="date" id="date-to"   class="registry-date" aria-label="To date"
                 title="To date">
          <span id="motion-count" class="registry-count"></span>
        </div>

        <div id="motion-list"></div>
      </div>

      <!-- Action items view -->
      <div id="actions-view" class="hidden" role="tabpanel">
        <div id="overdue-banner" class="overdue-banner hidden">
          <strong id="overdue-count"></strong> overdue action item<span id="overdue-plural"></span> — review and update below.
        </div>

        <div class="registry-filters">
          <select id="ai-status-filter" class="registry-select">
            <option value="open,in_progress">Open &amp; in progress</option>
            <option value="open">Open only</option>
            <option value="in_progress">In progress only</option>
            <option value="completed">Completed</option>
            <option value="">All</option>
          </select>
          <input type="search" id="ai-search" class="registry-search"
                 placeholder="Search action items…" autocomplete="off">
          <span id="ai-count" class="registry-count"></span>
        </div>

        <div id="action-item-list"></div>
      </div>

      <!-- Agenda view -->
      <div id="agenda-view" class="hidden" role="tabpanel">

        <div class="agenda-controls">
          <div class="form-group agenda-date-group">
            <label for="agenda-meeting-date">Next meeting date</label>
            <input type="date" id="agenda-meeting-date" class="registry-date">
          </div>
          <button id="agenda-download-btn" class="btn-secondary">Download .docx</button>
        </div>

        <div id="agenda-preview" class="agenda-preview"></div>

        <div class="agenda-new-business">
          <h3 class="agenda-new-business__heading">Add new business items</h3>
          <div class="agenda-new-business__input-row">
            <input type="text" id="agenda-new-item-input"
                   placeholder="e.g. Review insurance renewal quote"
                   autocomplete="off">
            <button id="agenda-add-item-btn" class="btn-secondary">Add</button>
          </div>
          <ul id="agenda-new-item-list" class="agenda-new-item-list"></ul>
        </div>

      </div>

    </div>

  </main>

  <!-- Minutes viewer modal -->
  <div id="minutes-modal" class="modal-overlay hidden" role="dialog" aria-modal="true"
       aria-label="Meeting minutes">
    <div class="modal-inner">
      <button id="modal-close" class="modal-close" aria-label="Close minutes">&#x2715;</button>
      <div id="modal-body" class="minutes-preview"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div class="site-footer__brand">
        <a href="/" class="logo" aria-label="MinuteHand home">
          <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <circle cx="14" cy="14" r="13" stroke="currentColor" stroke-width="2"/>
            <line x1="14" y1="14" x2="14" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="14" y1="14" x2="19" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          MinuteHand
        </a>
        <p class="site-footer__copy">&copy; 2026 TOP SPIDER CANADA. All rights reserved.</p>
      </div>
      <nav class="site-footer__nav" aria-label="Footer navigation">
        <a href="/app.html">Open App</a>
        <a href="/#pricing">Pricing</a>
        <a href="/refund.html">Refund Policy</a>
        <a href="/terms.html">Terms</a>
        <a href="/privacy.html">Privacy</a>
        <a href="mailto:hello@minutehand.ca">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="board.js"></script>
</body>
</html>
