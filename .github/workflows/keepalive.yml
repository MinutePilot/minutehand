name: Keep Supabase awake

# Supabase's free tier pauses a project after a week with no activity.
# This sends one small database read twice a week (Monday and Thursday) so the
# gap is never longer than four days. Delete this file once the project is on
# the Pro plan, which never pauses.

on:
  schedule:
    - cron: '23 9 * * 1,4'   # 09:23 UTC, Mondays and Thursdays
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Both values are public by design: the same URL and publishable key are
      # served to every visitor in config.js. Never put a secret key here.
      SUPABASE_URL: https://phzmhvslrzmrufzcjqei.supabase.co
      SUPABASE_KEY: sb_publishable_M_Bzj1H5y_ErDPcS-r47Gw_jYjpArps
    steps:
      - name: Read one row from the public reviews table
        run: |
          set -euo pipefail
          body=$(curl --silent --show-error --fail \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/reviews?select=id&limit=1")
          echo "Response: ${body}"
          # A real answer is a JSON array, empty or not. Anything else fails the job,
          # and GitHub emails the repository owner when a scheduled run fails.
          case "${body}" in
            \[*\]) echo "Supabase answered; project is awake." ;;
            *) echo "Unexpected response from Supabase." >&2; exit 1 ;;
          esac
